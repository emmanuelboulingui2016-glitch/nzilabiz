version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nzilabiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nzilabiz
      POSTGRES_PASSWORD: nzilabiz_dev_password
      POSTGRES_DB: nzilabiz
    ports:
      - "5432:5432"
    volumes:
      - nzilabiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzilabiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nzilabiz_pgdata:
